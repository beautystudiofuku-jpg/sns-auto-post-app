<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>sns-auto-post closing card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #0a0a0a;
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage {
    text-align: center;
    max-width: 1500px;
    padding: 60px;
  }
  .accent {
    width: 80px;
    height: 4px;
    background: #4f9eff;
    margin: 0 auto 48px;
    border-radius: 2px;
  }
  h1 {
    font-size: 72px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1.1;
    margin-bottom: 72px;
  }
  .meta-block {
    display: flex;
    flex-direction: column;
    gap: 22px;
    align-items: center;
  }
  .meta-row {
    font-size: 28px;
    color: #cccccc;
    letter-spacing: 0.3px;
  }
  .meta-label {
    color: #777777;
    margin-right: 14px;
    display: inline-block;
    min-width: 200px;
    text-align: right;
  }
  .meta-value {
    color: #ffffff;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="accent"></div>
    <h1>Thank you for reviewing.</h1>
    <div class="meta-block">
      <div class="meta-row">
        <span class="meta-label">Privacy Policy</span>
        <span class="meta-value">beautystudiofuku-jpg.github.io/sns-auto-post-app/privacy.html</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Terms</span>
        <span class="meta-value">beautystudiofuku-jpg.github.io/sns-auto-post-app/terms.html</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Contact</span>
        <span class="meta-value">night.safari.group@gmail.com</span>
      </div>
    </div>
  </div>
</body>
</html>
