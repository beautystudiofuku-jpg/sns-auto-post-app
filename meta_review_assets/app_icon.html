<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>sns-auto-post app icon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1024px;
    height: 1024px;
    overflow: hidden;
    background: #0a0a0a;
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage {
    text-align: center;
  }
  .accent {
    width: 140px;
    height: 8px;
    background: #4f9eff;
    margin: 0 auto 60px;
    border-radius: 4px;
  }
  .mark {
    font-size: 300px;
    font-weight: 700;
    letter-spacing: -8px;
    line-height: 1;
  }
  .sub {
    font-size: 64px;
    font-weight: 400;
    color: #aaaaaa;
    margin-top: 48px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="accent"></div>
    <div class="mark">SNS</div>
    <div class="sub">auto-post</div>
  </div>
</body>
</html>
