<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>sns-auto-post title card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #0a0a0a;
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage {
    text-align: center;
    max-width: 1400px;
    padding: 60px;
  }
  .accent {
    width: 80px;
    height: 4px;
    background: #4f9eff;
    margin: 0 auto 48px;
    border-radius: 2px;
  }
  h1 {
    font-size: 120px;
    font-weight: 700;
    letter-spacing: -2px;
    line-height: 1.1;
    margin-bottom: 28px;
  }
  .subtitle {
    font-size: 36px;
    font-weight: 300;
    color: #aaaaaa;
    margin-bottom: 80px;
    letter-spacing: 0.5px;
  }
  .meta-block {
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
  }
  .meta-row {
    font-size: 26px;
    color: #cccccc;
    letter-spacing: 0.5px;
  }
  .meta-label {
    color: #777777;
    margin-right: 12px;
  }
  .meta-value {
    color: #ffffff;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="accent"></div>
    <h1>sns-auto-post</h1>
    <p class="subtitle">Internal social media publishing tool</p>
    <div class="meta-block">
      <div class="meta-row">
        <span class="meta-label">Operator</span>
        <span class="meta-value">KOKO K.K. (Night Safari Group)</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Purpose</span>
        <span class="meta-value">Meta App Review demonstration</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Recorded</span>
        <span class="meta-value">May 2026</span>
      </div>
    </div>
  </div>
</body>
</html>
