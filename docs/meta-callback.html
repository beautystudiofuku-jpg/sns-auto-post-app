<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Instagram認証中...</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 60px 20px; color: #333; }
    .spinner { margin: 20px auto; width: 40px; height: 40px; border: 4px solid #eee; border-top: 4px solid #E1306C; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #e74c3c; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Instagramアカウントを接続中...</p>
  <div id="error" class="error" style="display:none"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error');
    const errorReason = params.get('error_reason');

    if (error) {
      document.querySelector('.spinner').style.display = 'none';
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = '認証エラー: ' + (errorReason || error);
    } else if (code) {
      const localUrl = 'http://localhost:3456/auth/meta/callback'
        + '?code=' + encodeURIComponent(code)
        + '&state=' + encodeURIComponent(state || '');
      window.location.href = localUrl;
    } else {
      document.querySelector('.spinner').style.display = 'none';
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = '不明なエラーが発生しました。もう一度お試しください。';
    }
  </script>
</body>
</html>
